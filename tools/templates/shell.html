<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
{{BASE}}  <title>{{TITLE}}</title>
{{SEO}}  <meta name="theme-color" content="#1b1b1b">
  <script>try{var s=localStorage.getItem('zk-theme');if(s==='light'||(s!=='dark'&&matchMedia('(prefers-color-scheme: light)').matches))document.documentElement.setAttribute('data-theme','light')}catch(e){}try{if(localStorage.getItem('zk-motion')!=='off'&&matchMedia('(hover: hover) and (pointer: fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&sessionStorage.getItem('zc-pos'))document.documentElement.className+=' zc-pre'}catch(e){}</script>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/Raleway-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
{{JSONLD}}</head>
<body data-page="{{PAGE}}"{{SLUG}} data-prerendered="1">
  <main></main>
  <noscript><p style="padding:40px;text-align:center">This site shows its portfolio with JavaScript on. Page text is still included in the page source.</p></noscript>
  <script src="js/icons.js"></script>
  <script src="js/media.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cursor.js" defer></script>
</body>
</html>
