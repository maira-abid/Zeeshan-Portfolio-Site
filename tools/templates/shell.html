<!doctype html>
<html lang="en-CA" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
{{BASE}}  <title>{{TITLE}}</title>
{{SEO}}  <meta name="theme-color" content="#ffffff">
  <script>try{if(localStorage.getItem('zk-theme')==='dark')document.documentElement.removeAttribute('data-theme')}catch(e){}try{if(matchMedia('(hover: hover) and (pointer: fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.className+=' zc-pre'}catch(e){}</script>
  <link rel="icon" id="favicon" type="image/png" sizes="32x32" href="assets/icons/zeeshan-abid-favicon-light-32.png">
  <link rel="icon" id="favicon-large" type="image/png" sizes="192x192" href="assets/icons/zeeshan-abid-favicon-light-192.png">
  <link rel="apple-touch-icon" id="favicon-apple" href="assets/icons/zeeshan-abid-favicon-light-180.png">
  <script>if(!document.documentElement.hasAttribute('data-theme')){["favicon","favicon-large","favicon-apple"].forEach(function(i){var l=document.getElementById(i);if(l)l.href=l.getAttribute("href").replace("-light-","-dark-")})}</script>
  <link rel="preload" href="assets/fonts/Raleway-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
{{JSONLD}}</head>
<body data-page="{{PAGE}}"{{SLUG}} data-prerendered="1">
  <main></main>
  <noscript><p style="padding:40px;text-align:center">This site shows its portfolio with JavaScript on. Page text is still included in the page source.</p></noscript>
  <script src="js/icons.js"></script>
  <script src="js/media.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cursor.js" defer></script>
</body>
</html>
